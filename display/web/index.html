<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZaY-o-Nator by BeatsbyLonza</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Libre+Baskerville:ital@1&display=swap" rel="stylesheet">
<style>
:root { --accent: #e8c77a; --u: min(1vw, 1.78vh); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #050506; overflow: hidden; }
body { font-family: 'Michroma', 'Helvetica Neue', Arial, sans-serif; color: #c9ced6; }
body.idle, body.idle * { cursor: none !important; }
#app { position: fixed; inset: 0; padding: calc(var(--u) * 2.2) calc(var(--u) * 3); display: flex; flex-direction: column; gap: calc(var(--u) * 1.5);
  background: radial-gradient(ellipse at 50% 35%, #1c1f25 0%, #0b0c0f 60%, #050506 100%); }
header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.left { display: flex; align-items: center; gap: calc(var(--u) * 1.2); }
.live { background: #b3261e; color: #fff; font-size: calc(var(--u) * 1.05); letter-spacing: .2em; padding: calc(var(--u) * .45) calc(var(--u) * 1); border-radius: calc(var(--u) * .35); box-shadow: 0 0 calc(var(--u) * 1.4) rgba(179,38,30,.55); }
.live.off { display: none; }
#srcName { font-size: calc(var(--u) * 1.15); color: #e7eaee; letter-spacing: .12em; text-transform: uppercase; }
.word { font-family: 'Libre Baskerville', Georgia, serif; font-style: italic; font-size: calc(var(--u) * 3.6); color: var(--accent); letter-spacing: .04em; text-shadow: 0 0 calc(var(--u) * 1.8) rgba(232,199,122,.45); white-space: nowrap; }
.right { display: flex; justify-content: flex-end; align-items: center; gap: calc(var(--u) * 1.2); font-size: calc(var(--u) * 1.05); color: #8d949e; letter-spacing: .1em; }
#meters { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: calc(var(--u) * 2.6); }
.cell { min-height: 0; border-radius: calc(var(--u) * 1); padding: calc(var(--u) * 1); background: #000; display: flex; gap: calc(var(--u) * 1);
  box-shadow: inset 0 0 0 2px #2a2e34, 0 0 calc(var(--u) * 4.5) rgba(241,217,149,.12), 0 calc(var(--u) * 1) calc(var(--u) * 3) rgba(0,0,0,.7); }
.peak { width: calc(var(--u) * 2.4); flex-shrink: 0; }
.vu { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
.vu svg, .peak svg { width: 100%; height: 100%; display: block; }
#specBox { height: 28%; min-height: calc(var(--u) * 10); border-radius: calc(var(--u) * .9); padding: calc(var(--u) * .9) calc(var(--u) * 1.2); display: flex; flex-direction: column; gap: calc(var(--u) * .5);
  background: linear-gradient(180deg, #0b1a26 0%, #06111a 100%); box-shadow: inset 0 0 0 1px #1f3a4d, 0 0 calc(var(--u) * 3.4) rgba(60,140,200,.18); }
.specHead { display: flex; justify-content: space-between; font-size: calc(var(--u) * .8); color: #7fb3d5; letter-spacing: .2em; }
#spec { flex: 1; min-height: 0; width: 100%; display: block; }
footer { display: flex; justify-content: space-between; align-items: center; gap: calc(var(--u) * 1); }
#chips { display: flex; gap: calc(var(--u) * .7); flex-wrap: wrap; }
.chip { font: inherit; font-size: calc(var(--u) * .8); letter-spacing: .12em; padding: calc(var(--u) * .55) calc(var(--u) * 1); border-radius: calc(var(--u) * .45); border: 0; cursor: pointer;
  background: #16181c; color: #8d949e; box-shadow: inset 0 0 0 1px #2c3036; text-transform: uppercase; }
.chip.on { background: var(--accent); color: #1a1408; box-shadow: 0 0 calc(var(--u) * 1.1) rgba(232,199,122,.5); }
.by { font-family: 'Libre Baskerville', Georgia, serif; font-style: italic; font-size: calc(var(--u) * 1.5); color: #d7dbe1; letter-spacing: .03em; white-space: nowrap; }
.tools { position: fixed; top: 12px; right: 12px; display: flex; gap: 8px; transition: opacity .4s; z-index: 5; }
body.idle .tools { opacity: 0; }
.tools button { font: 12px 'Michroma', sans-serif; letter-spacing: .1em; background: rgba(22,24,28,.85); color: #c9ced6; border: 1px solid #3a3f47; border-radius: 8px; padding: 10px 14px; cursor: pointer; }
.tools button:hover { border-color: var(--accent); color: var(--accent); }
#panel { position: fixed; top: 60px; right: 12px; width: min(380px, calc(100vw - 24px)); max-height: calc(100vh - 80px); overflow: auto; background: #111317; border: 1px solid #3a3f47; border-radius: 12px; padding: 18px; z-index: 6; display: none; font-size: 12px; letter-spacing: .05em; }
#panel.open { display: block; }
#panel h2 { font-size: 13px; margin: 0 0 14px; color: var(--accent); letter-spacing: .15em; font-weight: 400; }
#panel label { display: block; margin: 12px 0 6px; color: #8d949e; }
#panel select, #panel input[type=text] { width: 100%; font: 12px 'Michroma', sans-serif; background: #1a1d22; color: #e7eaee; border: 1px solid #3a3f47; border-radius: 6px; padding: 9px; }
#panel .row { display: flex; gap: 10px; align-items: center; margin-top: 12px; }
#panel .row label { margin: 0; color: #c9ced6; }
#panel p { color: #8d949e; line-height: 1.6; margin: 14px 0 0; }
#msg { color: #ffd23f; }
#specRow { height: 28%; min-height: calc(var(--u) * 10); display: flex; gap: calc(var(--u) * 1.5); }
#specRow #specBox { flex: 1; height: auto; min-width: 0; }
.tower { display: none; width: calc(var(--u) * 5); flex-shrink: 0; padding: calc(var(--u) * .6); border-radius: calc(var(--u) * .9); background: #000; box-shadow: inset 0 0 0 2px #2a2e34; }
#rack { display: none; flex: 1; min-height: 0; gap: calc(var(--u) * 1.6); grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); }
.tile { min-height: 0; border-radius: calc(var(--u) * 1); padding: calc(var(--u) * .9); background: #000; display: flex; flex-direction: column; gap: calc(var(--u) * .6); box-shadow: inset 0 0 0 2px #2a2e34, 0 0 calc(var(--u) * 3) rgba(241,217,149,.1); }
.tile h3 { margin: 0; font-weight: 400; font-size: calc(var(--u) * 1); letter-spacing: .14em; color: var(--accent); text-transform: uppercase; text-align: center; }
.tile .pair { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: calc(var(--u) * .8); }
.tile .pair > div { min-height: 0; display: flex; align-items: center; }
.tile svg { width: 100%; height: 100%; display: block; }
#faces { display: flex; gap: calc(var(--u) * .5); }
.face { font: inherit; font-size: calc(var(--u) * .75); letter-spacing: .14em; padding: calc(var(--u) * .5) calc(var(--u) * .8); border-radius: calc(var(--u) * .4); border: 0; cursor: pointer; background: transparent; color: #6b727c; box-shadow: inset 0 0 0 1px #2c3036; }
.face.on { color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
footer .mid { display: flex; align-items: center; gap: calc(var(--u) * 1.4); }
/* face 2: spectrum takes the screen */
#app.f2 #meters { flex: 0 0 26%; }
#app.f2 #specRow { flex: 1; height: auto; }
/* face 3: needles only */
#app.f3 #specRow { display: none; }
/* face 4: rack of every MPC */
#app.f4 #meters, #app.f4 #specRow { display: none; }
#app.f4 #rack { display: grid; }
/* face 5: console towers and bar spectrum */
#app.f5 #meters { display: none; }
#app.f5 #specRow { flex: 1; height: auto; }
#app.f5 .tower { display: block; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="left"><span class="live" id="live">LIVE</span><span id="srcName">Demo</span></div>
    <div class="word">ZaY-o-Nator</div>
    <div class="right"><span id="level">— dB RMS</span></div>
  </header>
  <div id="meters">
    <div class="cell"><div class="peak" id="peakL"></div><div class="vu" id="vuL"></div></div>
    <div class="cell"><div class="vu" id="vuR"></div><div class="peak" id="peakR"></div></div>
  </div>
  <div id="rack"></div>
  <div id="specRow">
  <div class="tower" id="towerL"></div>
  <div id="specBox">
    <div class="specHead"><span>SPECTRUM</span><span>20 HZ — 20 KHZ</span></div>
    <svg id="spec" viewBox="0 0 1000 260" preserveAspectRatio="none" role="img" aria-label="Frequency spectrum">
      <defs>
        <linearGradient id="specFill" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="260">
          <stop offset="0%" stop-color="#ff3b30" stop-opacity=".95"/>
          <stop offset="18%" stop-color="#ff3b30" stop-opacity=".9"/>
          <stop offset="30%" stop-color="#ffd23f" stop-opacity=".9"/>
          <stop offset="48%" stop-color="#ffd23f" stop-opacity=".85"/>
          <stop offset="60%" stop-color="#2fd36b" stop-opacity=".85"/>
          <stop offset="100%" stop-color="#0f5a3a" stop-opacity=".65"/>
        </linearGradient>
        <filter id="specGlow" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur stdDeviation="8"/></filter>
      </defs>
      <g stroke="#1d3b50" stroke-width="1" id="grid"></g>
      <path id="specGlowPath" fill="url(#specFill)" opacity=".5" filter="url(#specGlow)"/>
      <path id="specPath" fill="url(#specFill)"/>
      <path id="specLine" fill="none" stroke="#eef5fb" stroke-width="2.5" stroke-opacity=".85" vector-effect="non-scaling-stroke"/>
    </svg>
  </div>
  <div class="tower" id="towerR"></div>
  </div>
  <footer>
    <div id="chips"></div>
    <div class="mid"><div id="faces"></div><span class="by">by BeatsbyLonza</span></div>
  </footer>
</div>

<div class="tools">
  <button id="btnFace" type="button">NEXT FACE (1–5)</button>
  <button id="btnSettings" type="button">SETTINGS (S)</button>
  <button id="btnFull" type="button">FULL SCREEN (F)</button>
</div>

<div id="panel" role="dialog" aria-label="Settings">
  <h2>ZAY-O-NATOR SETTINGS</h2>
  <label for="selSource">Listen to</label>
  <select id="selSource"></select>
  <label for="selDevice">Audio input (Loopback, interface, mic)</label>
  <select id="selDevice"></select>
  <label for="selPair">Channels</label>
  <select id="selPair"></select>
  <label for="txtName">Name shown on screen</label>
  <input id="txtName" type="text" maxlength="30" placeholder="MPC LIVE III">
  <label for="selLookL">Left meter</label>
  <select id="selLookL"><option value="classic">Classic cream</option><option value="noir">Noir amber</option></select>
  <label for="selLookR">Right meter</label>
  <select id="selLookR"><option value="classic">Classic cream</option><option value="noir">Noir amber</option></select>
  <label for="selRef">0 VU level (loud beats: -10)</label>
  <select id="selRef"><option value="18">-18 dBFS</option><option value="14">-14 dBFS</option><option value="10">-10 dBFS</option></select>
  <label for="selAccent">Accent</label>
  <select id="selAccent"><option value="#e8c77a">Gold</option><option value="#7fb3d5">Blue</option><option value="#e05a4f">Red</option></select>
  <div class="row"><input id="chkLive" type="checkbox"><label for="chkLive">Show LIVE badge</label></div>
  <div class="row"><input id="chkChips" type="checkbox"><label for="chkChips">Show source buttons</label></div>
  <div class="row"><input id="chkFaces" type="checkbox"><label for="chkFaces">Show face buttons</label></div>
  <div class="row"><input id="chkCycle" type="checkbox"><label for="chkCycle">Change face every 30 seconds</label></div>
  <p id="msg"></p>
  <p>Tip: in StreamYard, share this window, or put it full screen on your extra monitor and point a camera at it. The mouse and buttons hide after 3 seconds.</p>
</div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const store = (() => { try { return window.localStorage; } catch (e) { return null; } })();
const saved = (() => { try { return JSON.parse(store.getItem('zayonator') || '{}'); } catch (e) { return {}; } })();
const S = Object.assign({ source: 'demo', device: '', pair: 0, name: '', lookL: 'classic', lookR: 'noir', accent: '#e8c77a', live: true, chips: true, face: 1, faces: true, cycle: false, ref: 10 }, saved);
const FACES = ['DUO', 'SPECTRUM', 'NEEDLES', 'RACK', 'CONSOLE'];
function save() { try { store.setItem('zayonator', JSON.stringify(S)); } catch (e) {} }

// ---------- the VU meter (same face as the design) ----------
const MARKS = [[-20,-48,'20'],[-10,-30,'10'],[-7,-20,'7'],[-5,-12,'5'],[-3,-2,'3'],[-2,5,'2'],[-1,11,'1'],[0,18,'0'],[1,28,'1'],[2,37,'2'],[3,47,'3']];
const LOOKS = {
  classic: { f: ['#fff4cf','#f1d995','#c9a259','#8a6a32'], glow: '#f1d995', ink: '#2b2418', red: '#b3261e', needle: '#151515' },
  noir:    { f: ['#2a2216','#17130d','#0d0b08','#050403'], glow: '#ffb547', ink: '#ffc36b', red: '#ff4b3e', needle: '#ff7a3d' }
};
const CX = 150, CY = 182;
const pt = (a, r) => { const t = a * Math.PI / 180; return [(CX + r * Math.sin(t)).toFixed(1), (CY - r * Math.cos(t)).toFixed(1)]; };
function vuSVG(id, side, lookName) {
  const L = LOOKS[lookName] || LOOKS.classic;
  let ticks = '';
  for (const [v, a, label] of MARKS) {
    const c = v > 0 ? L.red : L.ink, [x1, y1] = pt(a, 118), [x2, y2] = pt(a, 130), [tx, ty] = pt(a, 142);
    ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="2"/>`;
    ticks += `<text x="${tx}" y="${(+ty + 4).toFixed(1)}" fill="${c}">${label}</text>`;
  }
  for (let a = -48; a <= 18; a += 4) { const [x1, y1] = pt(a, 118), [x2, y2] = pt(a, 124); ticks += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${L.ink}" stroke-width="1"/>`; }
  const [ax, ay] = pt(-48, 118), [bx, by] = pt(18, 118), [rx, ry] = pt(18, 121), [ex, ey] = pt(47, 121);
  return `<svg viewBox="0 0 300 190" preserveAspectRatio="xMidYMid meet" role="img" aria-label="VU meter ${side}">
  <defs>
    <radialGradient id="${id}f" cx="50%" cy="78%" r="80%"><stop offset="0%" stop-color="${L.f[0]}"/><stop offset="45%" stop-color="${L.f[1]}"/><stop offset="85%" stop-color="${L.f[2]}"/><stop offset="100%" stop-color="${L.f[3]}"/></radialGradient>
    <linearGradient id="${id}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#4a4f57"/><stop offset="50%" stop-color="#1b1d21"/><stop offset="100%" stop-color="#2c3036"/></linearGradient>
    <linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fff" stop-opacity=".35"/><stop offset="55%" stop-color="#fff" stop-opacity=".04"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="${id}x" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect x="2" y="2" width="296" height="186" rx="10" fill="url(#${id}b)"/>
  <rect x="14" y="14" width="272" height="162" rx="5" fill="${L.glow}" filter="url(#${id}x)" opacity=".55"/>
  <rect x="14" y="14" width="272" height="162" rx="5" fill="url(#${id}f)"/>
  <path d="M ${ax} ${ay} A118 118 0 0 1 ${bx} ${by}" fill="none" stroke="${L.ink}" stroke-width="1.6"/>
  <path d="M ${rx} ${ry} A121 121 0 0 1 ${ex} ${ey}" fill="none" stroke="${L.red}" stroke-width="7"/>
  <g font-family="Michroma, sans-serif" font-size="11" text-anchor="middle">${ticks}
    <text x="34" y="112" fill="${L.ink}" font-size="14">−</text><text x="262" y="112" fill="${L.red}" font-size="14">+</text>
    <text x="262" y="164" fill="${L.ink}" font-size="12">VU</text><text x="34" y="164" fill="${L.ink}">${side}</text></g>
  <text x="150" y="128" text-anchor="middle" font-family="'Libre Baskerville', Georgia, serif" font-style="italic" font-size="17" fill="${L.ink}" letter-spacing="1.5">ZaY-o-Nator</text>
  <line id="${id}n" x1="150" y1="182" x2="150" y2="58" stroke="${L.needle}" stroke-width="1.8" stroke-linecap="round" transform="rotate(-48 150 182)"/>
  <path d="M 108 176 A 42 30 0 0 1 192 176 Z" fill="#141414"/>
  <rect x="14" y="14" width="272" height="162" rx="5" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="3"/>
  <path d="M 14 14 L 200 14 L 90 176 L 14 176 Z" fill="url(#${id}g)"/>
</svg>`;
}
// VU reading (0 VU = S.ref below full scale; -10 dBFS by default so loud beats swing around 0) to needle angle, along the printed scale
function vuAngle(vu) {
  if (vu <= MARKS[0][0]) return Math.max(-52, MARKS[0][1] + (vu - MARKS[0][0]) * 0.6);
  for (let i = 1; i < MARKS.length; i++) {
    const [v1, a1] = MARKS[i], [v0, a0] = MARKS[i - 1];
    if (vu <= v1) return a0 + (a1 - a0) * (vu - v0) / (v1 - v0);
  }
  return Math.min(52, 47 + (vu - 3) * 4);
}

// ---------- LED peak meters ----------
const SEGS = 24;
const ledOn  = (i) => i < 16 ? '#2fd36b' : i < 21 ? '#ffd23f' : '#ff3b30';
const ledOff = (i) => i < 16 ? '#0f3a1f' : i < 21 ? '#3d3310' : '#3d1210';
function peakSVG(box) {
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 30 300');
  svg.setAttribute('preserveAspectRatio', 'none');
  svg.setAttribute('aria-hidden', 'true');
  const rects = [];
  for (let i = 0; i < SEGS; i++) {
    const r = document.createElementNS(NS, 'rect');
    r.setAttribute('x', 4); r.setAttribute('y', 300 - 6 - (i + 1) * 12 + 2); r.setAttribute('width', 22); r.setAttribute('height', 10); r.setAttribute('rx', 2);
    r.setAttribute('fill', ledOff(i));
    svg.appendChild(r); rects.push(r);
  }
  box.replaceChildren(svg);
  return { rects, lit: -1, hold: -1, holdUntil: 0, level: -120 };
}

// NEEDLES (face 3) puts the black (noir) meter first
function drawMeters() {
  const swap = S.face === 3;
  $('vuL').innerHTML = vuSVG('vl', 'L', swap ? S.lookR : S.lookL);
  $('vuR').innerHTML = vuSVG('vr', 'R', swap ? S.lookL : S.lookR);
}
drawMeters();
const peaks = [peakSVG($('peakL')), peakSVG($('peakR'))];
const towers = [peakSVG($('towerL')), peakSVG($('towerR'))];

// ---------- the five faces ----------
let cycleTimer = 0;
function setFace(n) {
  S.face = ((n - 1 + FACES.length) % FACES.length) + 1; save();
  $('app').className = 'f' + S.face;
  drawMeters();
  $('faces').replaceChildren(...FACES.map((name, i) => {
    const b = document.createElement('button'); b.type = 'button';
    b.className = 'face' + (i + 1 === S.face ? ' on' : ''); b.textContent = (i + 1) + ' ' + name;
    b.onclick = () => { setFace(i + 1); restartCycle(); }; return b;
  }));
  $('faces').style.display = S.faces ? 'flex' : 'none';
  if (S.face === 4) buildRack();
}
function restartCycle() {
  clearInterval(cycleTimer);
  if (S.cycle) cycleTimer = setInterval(() => setFace(S.face + 1), 30000);
}

// ---------- face 4: a meter pair for every source ----------
let rackTiles = [], rackKey = '';
function rackSources() {
  const list = mpcList.map((n) => 'mpc:' + n);
  if (S.source === 'input' || S.source === 'demo' || !list.length) list.unshift(S.source.startsWith('mpc:') ? 'demo' : S.source);
  return list;
}
function buildRack() {
  const list = rackSources(), key = list.join('|') + S.lookL + S.lookR;
  if (key === rackKey) return;
  rackKey = key;
  const cols = list.length <= 1 ? 1 : list.length <= 4 ? 2 : list.length <= 9 ? 3 : 4;
  $('rack').style.setProperty('--cols', cols);
  rackTiles = list.map((src, i) => {
    const t = document.createElement('div'); t.className = 'tile';
    const name = src === 'input' ? (S.name || 'Audio input') : src === 'demo' ? 'Demo' : src.slice(4);
    t.innerHTML = `<h3></h3><div class="pair"><div>${vuSVG('k' + i + 'l', 'L', S.lookL)}</div><div>${vuSVG('k' + i + 'r', 'R', S.lookR)}</div></div>`;
    t.querySelector('h3').textContent = name;
    return { src, el: t, nl: null, nr: null, v: [-60, -60] };
  });
  $('rack').replaceChildren(...rackTiles.map((r) => r.el));
  rackTiles.forEach((r, i) => { r.nl = $('k' + i + 'ln'); r.nr = $('k' + i + 'rn'); });
}
(() => { let g = ''; for (let i = 1; i < 5; i++) g += `<line x1="0" y1="${i * 52}" x2="1000" y2="${i * 52}"/>`; for (let i = 1; i < 10; i++) g += `<line x1="${i * 100}" y1="0" x2="${i * 100}" y2="260"/>`; $('grid').innerHTML = g; })();

// ---------- sources ----------
let ctx = null, stream = null, anaL = null, anaR = null, anaS = null, bufL, bufR, bufS;
let mpcFrames = {}, mpcList = [], chanCount = 2;
const msg = (t) => { $('msg').textContent = t || ''; };

async function startInput() {
  stopInput();
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: {
      deviceId: S.device ? { exact: S.device } : undefined,
      echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: { ideal: 32 } } });
  } catch (e) { msg('Allow microphone access in your browser to use an audio input. (' + e.name + ')'); return; }
  ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
  if (ctx.state === 'suspended') await ctx.resume();
  const track = stream.getAudioTracks()[0];
  chanCount = Math.max(1, (track.getSettings && track.getSettings().channelCount) || 2);
  const src = ctx.createMediaStreamSource(stream);
  const split = ctx.createChannelSplitter(Math.max(2, chanCount));
  src.connect(split);
  const a = Math.min(S.pair * 2, Math.max(0, chanCount - 1)), b = Math.min(a + 1, chanCount - 1);
  anaL = ctx.createAnalyser(); anaL.fftSize = 2048;
  anaR = ctx.createAnalyser(); anaR.fftSize = 2048;
  anaS = ctx.createAnalyser(); anaS.fftSize = 8192; anaS.smoothingTimeConstant = 0.6;
  split.connect(anaL, a); split.connect(anaR, b);
  const sum = ctx.createGain(); sum.gain.value = 0.5;
  split.connect(sum, a); split.connect(sum, b); sum.connect(anaS);
  bufL = new Float32Array(anaL.fftSize); bufR = new Float32Array(anaR.fftSize); bufS = new Float32Array(anaS.frequencyBinCount);
  msg('');
  await listDevices();
}
function stopInput() {
  if (stream) stream.getTracks().forEach((t) => t.stop());
  stream = null; anaL = anaR = anaS = null;
}
async function listDevices() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
  const devs = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'audioinput');
  const sel = $('selDevice');
  sel.innerHTML = '<option value="">Default input</option>' + devs.map((d, i) => `<option value="${d.deviceId}">${(d.label || 'Input ' + (i + 1)).replace(/</g, '')}</option>`).join('');
  sel.value = devs.some((d) => d.deviceId === S.device) ? S.device : '';
  const pairs = Math.max(1, Math.ceil(chanCount / 2));
  $('selPair').innerHTML = Array.from({ length: pairs }, (_, i) => `<option value="${i}">${chanCount === 1 ? '1 (mono)' : (i * 2 + 1) + '–' + Math.min(i * 2 + 2, chanCount)}</option>`).join('');
  $('selPair').value = String(Math.min(S.pair, pairs - 1));
}

const es = new EventSource('/events');
es.onmessage = (e) => { try { const f = JSON.parse(e.data); f.t = performance.now(); mpcFrames[f.source] = f; } catch (x) {} };
async function pollSources() {
  try {
    const r = await fetch('/api/sources'); const j = await r.json();
    const list = (j.sources || []).sort();
    if (list.join('|') !== mpcList.join('|')) { mpcList = list; renderSources(); if (S.face === 4) buildRack(); }
  } catch (e) {}
}
setInterval(pollSources, 3000); pollSources();

function sourceLabel() {
  if (S.name) return S.name;
  if (S.source === 'demo') return 'Demo';
  if (S.source === 'input') return 'Audio input';
  return S.source.slice(4);
}
function renderSources() {
  const opts = [['demo', 'Demo (moves by itself)'], ['input', 'Audio input on this computer']].concat(mpcList.map((n) => ['mpc:' + n, 'MPC: ' + n]));
  if (S.source.startsWith('mpc:') && !mpcList.includes(S.source.slice(4))) opts.push([S.source, 'MPC: ' + S.source.slice(4) + ' (not seen)']);
  $('selSource').innerHTML = opts.map(([v, t]) => `<option value="${v.replace(/"/g, '')}">${t.replace(/</g, '')}</option>`).join('');
  $('selSource').value = S.source;
  const chips = [['input', 'Input']].concat(mpcList.map((n) => ['mpc:' + n, n]));
  $('chips').replaceChildren(...chips.map(([v, t]) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip' + (v === S.source ? ' on' : ''); b.textContent = t;
    b.onclick = () => setSource(v); return b;
  }));
  $('chips').style.visibility = S.chips ? 'visible' : 'hidden';
  $('srcName').textContent = sourceLabel();
}
function setSource(v) {
  S.source = v; save();
  if (v === 'input') startInput(); else stopInput();
  renderSources();
  if (S.face === 4) buildRack();
}

// ---------- settings ----------
function applyLook() {
  document.documentElement.style.setProperty('--accent', S.accent);
  $('live').classList.toggle('off', !S.live);
}
$('selSource').onchange = (e) => setSource(e.target.value);
$('selDevice').onchange = (e) => { S.device = e.target.value; S.pair = 0; save(); if (S.source === 'input') startInput(); else setSource('input'); };
$('selPair').onchange = (e) => { S.pair = +e.target.value; save(); if (S.source === 'input') startInput(); };
$('txtName').value = S.name;
$('txtName').oninput = (e) => { S.name = e.target.value.trim(); save(); renderSources(); };
$('selLookL').value = S.lookL; $('selLookR').value = S.lookR; $('selAccent').value = S.accent;
$('selLookL').onchange = (e) => { S.lookL = e.target.value; save(); drawMeters(); if (S.face === 4) buildRack(); };
$('selLookR').onchange = (e) => { S.lookR = e.target.value; save(); drawMeters(); if (S.face === 4) buildRack(); };
$('chkFaces').checked = S.faces; $('chkFaces').onchange = (e) => { S.faces = e.target.checked; save(); setFace(S.face); };
$('chkCycle').checked = S.cycle; $('chkCycle').onchange = (e) => { S.cycle = e.target.checked; save(); restartCycle(); };
$('btnFace').onclick = () => { setFace(S.face + 1); restartCycle(); };
$('selRef').value = String(S.ref); $('selRef').onchange = (e) => { S.ref = +e.target.value; save(); };
$('selAccent').onchange = (e) => { S.accent = e.target.value; save(); applyLook(); };
$('chkLive').checked = S.live; $('chkLive').onchange = (e) => { S.live = e.target.checked; save(); applyLook(); };
$('chkChips').checked = S.chips; $('chkChips').onchange = (e) => { S.chips = e.target.checked; save(); renderSources(); };
const togglePanel = () => $('panel').classList.toggle('open');
const toggleFull = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); };
$('btnSettings').onclick = togglePanel; $('btnFull').onclick = toggleFull;
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.key === 's' || e.key === 'S') togglePanel();
  if (e.key === 'f' || e.key === 'F') toggleFull();
  if (e.key === 'Escape') $('panel').classList.remove('open');
  if (e.key >= '1' && e.key <= '5') { setFace(+e.key); restartCycle(); }
  if (e.key === 'ArrowRight' || e.key === ' ') { setFace(S.face + 1); restartCycle(); }
  if (e.key === 'ArrowLeft') { setFace(S.face - 1); restartCycle(); }
});
let idleTimer = 0;
function wake() { document.body.classList.remove('idle'); clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (!$('panel').classList.contains('open')) document.body.classList.add('idle'); }, 3000); }
['mousemove', 'mousedown', 'keydown', 'touchstart'].forEach((ev) => document.addEventListener(ev, wake, { passive: true }));
wake(); applyLook(); renderSources(); setFace(S.face); restartCycle();
if (S.source === 'input') startInput();
listDevices().catch(() => {});

// ---------- the meters, every frame ----------
const NPTS = 120, FMIN = 25, FMAX = 20000;
const spec = new Float32Array(NPTS).fill(-100);
const vuState = [-60, -60];
let rmsAvg = -60, last = performance.now(), demoT = 0;
const toDb = (x) => 20 * Math.log10(Math.max(x, 1e-6));

function readInput() {
  anaL.getFloatTimeDomainData(bufL); anaR.getFloatTimeDomainData(bufR);
  const lv = (b) => { let p = 0, s = 0; for (let i = 0; i < b.length; i++) { const v = b[i]; s += v * v; if (Math.abs(v) > p) p = Math.abs(v); } return [toDb(p), toDb(Math.sqrt(s / b.length))]; };
  const [pl, rl] = lv(bufL), [pr, rr] = lv(bufR);
  anaS.getFloatFrequencyData(bufS);
  const binHz = ctx.sampleRate / anaS.fftSize, bands = new Float32Array(NPTS);
  for (let i = 0; i < NPTS; i++) {
    const f0 = FMIN * Math.pow(FMAX / FMIN, i / NPTS), f1 = FMIN * Math.pow(FMAX / FMIN, (i + 1) / NPTS);
    let k0 = Math.max(1, Math.floor(f0 / binHz)), k1 = Math.max(k0 + 1, Math.ceil(f1 / binHz));
    let m = -140; for (let k = k0; k < k1 && k < bufS.length; k++) m = Math.max(m, bufS[k]);
    bands[i] = m + 4.5 * Math.log2(Math.max(f0, 50) / 1000);   // tilt so highs show like a mastering analyser
  }
  return { peak: [pl, pr], rms: [rl, rr], bands };
}
function readMpc(name) {
  const f = mpcFrames[name];
  const bands = new Float32Array(NPTS).fill(-120);
  if (!f || performance.now() - f.t > 1000) return { peak: [-120, -120], rms: [-120, -120], bands };
  const b = f.bands || [];
  if (b.length > 1) for (let i = 0; i < NPTS; i++) { const x = i / (NPTS - 1) * (b.length - 1), j = Math.floor(x), t = x - j; bands[i] = b[j] * (1 - t) + b[Math.min(j + 1, b.length - 1)] * t; }
  return { peak: [f.peakL, f.peakR], rms: [f.rmsL, f.rmsR], bands };
}
function readDemo(dt) {
  demoT += dt;
  const kick = Math.pow(Math.max(0, Math.sin(demoT * Math.PI * 2 * 1.2)), 8);
  const rl = -22 + kick * 14 + Math.sin(demoT * 1.3) * 3, rr = -23 + kick * 13 + Math.sin(demoT * 1.7) * 3;
  const bands = new Float32Array(NPTS);
  for (let i = 0; i < NPTS; i++) {
    const f = i / NPTS;
    bands[i] = -78 + 52 * Math.exp(-((f - 0.2) ** 2) / 0.01) * (0.6 + 0.4 * kick) + 26 * Math.exp(-((f - 0.55) ** 2) / 0.04) + 18 * (1 - f) + Math.sin(i * 0.7 + demoT * 6) * 4 - f * 12;
  }
  return { peak: [rl + 8, rr + 8], rms: [rl, rr], bands };
}

function setPeak(m, db, now, dt) {
  m.level = db > m.level ? db : Math.max(db, m.level - 26 * dt);   // instant up, falls ~26 dB a second
  const n = Math.max(0, Math.min(SEGS, Math.round((m.level + 48) / 48 * SEGS)));
  if (n - 1 >= m.hold || now > m.holdUntil) { m.hold = n - 1; m.holdUntil = now + 1500; }
  for (let i = 0; i < SEGS; i++) {
    const on = i < n || (i === m.hold && m.hold > 0);
    const fill = on ? ledOn(i) : ledOff(i);
    if (m.rects[i].getAttribute('fill') !== fill) m.rects[i].setAttribute('fill', fill);
  }
}

function frameLoop(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  let d;
  if (S.source === 'input' && anaL) d = readInput();
  else if (S.source.startsWith('mpc:')) d = readMpc(S.source.slice(4));
  else if (S.source === 'demo') d = readDemo(dt);
  else d = { peak: [-120, -120], rms: [-120, -120], bands: new Float32Array(NPTS).fill(-120) };

  // VU ballistics: about 300 ms to settle, like a real meter
  const k = 1 - Math.exp(-dt / 0.3);
  ['vln', 'vrn'].forEach((id, c) => {
    vuState[c] += (d.rms[c] - vuState[c]) * k;
    const el = $(id); if (el) el.setAttribute('transform', `rotate(${vuAngle(vuState[c] + S.ref).toFixed(2)} 150 182)`);
  });
  if (S.face === 5) { setPeak(towers[0], d.peak[0], now, dt); setPeak(towers[1], d.peak[1], now, dt); }
  else if (S.face !== 4) { setPeak(peaks[0], d.peak[0], now, dt); setPeak(peaks[1], d.peak[1], now, dt); }
  if (S.face === 4) {
    for (const r of rackTiles) {
      const rd = r.src === S.source ? d : r.src.startsWith('mpc:') ? readMpc(r.src.slice(4)) : d;
      for (let c = 0; c < 2; c++) r.v[c] += (rd.rms[c] - r.v[c]) * k;
      if (r.nl) r.nl.setAttribute('transform', `rotate(${vuAngle(r.v[0] + S.ref).toFixed(2)} 150 182)`);
      if (r.nr) r.nr.setAttribute('transform', `rotate(${vuAngle(r.v[1] + S.ref).toFixed(2)} 150 182)`);
    }
  }

  rmsAvg += ((d.rms[0] + d.rms[1]) / 2 - rmsAvg) * (1 - Math.exp(-dt / 3));
  $('level').textContent = rmsAvg > -80 ? rmsAvg.toFixed(1) + ' dB RMS' : '— dB RMS';

  // spectrum: jumps up, falls back smoothly
  let path = 'M0 260', line = '';
  for (let i = 0; i < NPTS; i++) {
    const v = d.bands[i];
    spec[i] = v > spec[i] ? spec[i] + (v - spec[i]) * 0.6 : Math.max(v, spec[i] - 60 * dt);
    const h = Math.max(0, Math.min(1, (spec[i] + 90) / 80));
    const x = (i / (NPTS - 1) * 1000).toFixed(1), y = (258 - h * 248).toFixed(1);
    path += ` L${x} ${y}`; line += (i ? ' L' : 'M') + x + ' ' + y;
  }
  path += ' L1000 260 Z';
  if (S.face === 5) {   // console: 60 LED-style bars, colored by height
    path = ''; line = '';
    const bars = 60, w = 1000 / bars;
    for (let b = 0; b < bars; b++) {
      const i = Math.floor(b * NPTS / bars), h = Math.max(0, Math.min(1, (spec[i] + 90) / 80));
      const y = 258 - h * 248, x = b * w + w * 0.15;
      path += `M${x.toFixed(1)} 260 L${x.toFixed(1)} ${y.toFixed(1)} L${(x + w * 0.7).toFixed(1)} ${y.toFixed(1)} L${(x + w * 0.7).toFixed(1)} 260 Z`;
    }
  }
  $('specPath').setAttribute('d', path); $('specGlowPath').setAttribute('d', path); $('specLine').setAttribute('d', line || 'M0 260');
  requestAnimationFrame(frameLoop);
}
requestAnimationFrame(frameLoop);
// Some browsers only start audio after a click
document.addEventListener('click', () => { if (ctx && ctx.state === 'suspended') ctx.resume(); });
</script>
</body>
</html>
