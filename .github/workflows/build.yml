name: build

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  # The MPC plugin, built with Akai's MPC Plugin SDK for Gen1 (arm32) and Gen2 (arm64) MPCs.
  plugin:
    runs-on: ubuntu-24.04
    env:
      SDK_COMMIT: febd2ca5bd9eb16c4a412837196e145566bc981b   # Akai MPC Plugin SDK, the version GPP Link ships with
    steps:
      - uses: actions/checkout@v4
      - name: Get Akai's MPC Plugin SDK
        uses: actions/checkout@v4
        with:
          repository: inmusic-software/mpc-plugin-builder-sdk
          ref: ${{ env.SDK_COMMIT }}
          path: sdk
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build the plugin for Gen1 (arm32) and Gen2 (arm64)
        run: python sdk/tools/build.py mpc-plugin
      - name: SDK host simulator test
        run: sdk/.sdk-tools/host_sim mpc-plugin/build/native/zay-o-nator.so test --wav mpc-plugin/build/test.wav
      - name: Plugin in a pretend MPC, sending its meters
        run: |
          c++ -std=c++17 -Wall -Wextra -O1 -Isdk/framework tests/plugin_host_test.cpp -ldl -lpthread -o plugin_host_test
          sh tests/plugin_test.sh ./plugin_host_test mpc-plugin/build/native/zay-o-nator.so
      - name: Package
        run: python sdk/tools/package.py mpc-plugin --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: ZaY-o-Nator-MPC-Plugin
          path: dist/*.zip
      # The Open MPC catalog's release zips (one per MPC generation, plus Akai's one-folder SDK zip), checked by the catalog's own tools.
      - name: Get Open MPC's release tools
        uses: actions/checkout@v4
        with:
          repository: open-mpc/mpc-vst-plugins
          ref: be72c8ee9889616174315d3026fa5a9d07c3b04b
          path: openmpc
      - name: Make and check the catalog release zips
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("mpc-plugin/plugin.json"))["version"])')
          case "$GITHUB_REF" in refs/tags/v*) [ "${GITHUB_REF#refs/tags/v}" = "$VERSION" ] || { echo "::error::tag $GITHUB_REF_NAME does not match plugin.json version $VERSION"; exit 1; };; esac
          mkdir -p release
          python3 openmpc/tools/sdk_release.py "mpc-plugin/build/BeatsbyLonza - VST - ZaY-o-Nator" --version "$VERSION" \
            --id zay-o-nator --repo "$GITHUB_REPOSITORY" --license MIT \
            --about "Backlit VU meters, LED peak meters and a spectrum on your MPC screen" \
            --requires "Nothing: the meters run on the MPC. Wi-Fi only for the optional ZaY-o-Nator Display (sold separately by BeatsbyLonza)" \
            -o release
          for z in release/*-mpc-armv7.zip release/*-mpc-aarch64.zip; do python3 openmpc/tools/catalog_check.py "$z" --catalog; done
          python3 openmpc/tools/sdk_zip.py "release/ZaY-o-Nator-$VERSION-mpc-sdk.zip" release/*-mpc-armv7.zip release/*-mpc-aarch64.zip
          ls -l release
      - uses: actions/upload-artifact@v4
        with:
          name: ZaY-o-Nator-Release
          path: release/*.zip

  # The DAW plugin for the Mac: VST3 and AU, Apple Silicon and Intel in one (DPF, ISC licence).
  daw-plugin:
    # Intel Mac servers: GitHub's Apple Silicon ones are often too busy. It still builds for both.
    runs-on: macos-15-intel
    env:
      DPF_COMMIT: 4238e1c7f0351bbe488d79f0899c540543ac7583
    steps:
      - uses: actions/checkout@v4
      - name: Get DPF (DISTRHO Plugin Framework)
        run: |
          git clone https://github.com/DISTRHO/DPF dpf
          git -C dpf checkout "$DPF_COMMIT"
          git -C dpf submodule update --init --recursive
      - name: Drum hit detection test (DRUMS face), loud and quiet mixes
        run: |
          c++ -std=c++17 -O2 -Wall -Idaw-plugin tests/drum_hits_test.cpp -o drum_hits_test
          ./drum_hits_test
          GAIN=0.1 ./drum_hits_test
      - name: Build VST3 and AU (universal)
        working-directory: daw-plugin
        run: |
          # NOOPT: plain -O2 for both processors (no Intel-only flags, so it builds on any Mac)
          make macos-universal-10.15 DPF_PATH=../dpf NOOPT=true -j3
          ls bin
          lipo -info "bin/ZaY-o-Nator.vst3/Contents/MacOS/ZaY-o-Nator" "bin/ZaY-o-Nator.component/Contents/MacOS/ZaY-o-Nator"
      - name: Sign (ad hoc, so Apple Silicon will load them)
        working-directory: daw-plugin/bin
        run: |
          codesign --force --deep -s - "ZaY-o-Nator.vst3"
          codesign --force --deep -s - "ZaY-o-Nator.component"
      - name: Apple's AU validator, with a meter listener running
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "daw-plugin/bin/ZaY-o-Nator.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          python3 tests/udp_listen.py 60 > heard.txt &
          sleep 1
          auval -v aufx ZyNa Bbyl | tee auval.log
          grep -q "AU VALIDATION SUCCEEDED" auval.log
          sleep 1
          if grep -q "DAW MASTER" heard.txt 2>/dev/null; then echo "PASS  the DAW plugin sent its meters"; else echo "NOTE  auval did not run long enough to send meters (not a failure)"; fi
      - name: Package
        run: |
          mkdir -p "dist/ZaY-o-Nator DAW Plugins"
          cp -R daw-plugin/bin/ZaY-o-Nator.vst3 daw-plugin/bin/ZaY-o-Nator.component "daw-plugin/Install ZaY-o-Nator Plugins.command" daw-plugin/README.md LICENSE "dist/ZaY-o-Nator DAW Plugins/"
          chmod +x "dist/ZaY-o-Nator DAW Plugins/Install ZaY-o-Nator Plugins.command"
          (cd dist && ditto -c -k --keepParent "ZaY-o-Nator DAW Plugins" ZaY-o-Nator-DAW-Plugins-Mac.zip)
      - uses: actions/upload-artifact@v4
        with:
          name: ZaY-o-Nator-DAW-Plugins-Mac
          path: dist/ZaY-o-Nator-DAW-Plugins-Mac.zip

  # The DAW plugin for Windows: VST3, 64-bit, built on Linux with MinGW (everything linked in, no extra DLLs).
  daw-plugin-windows:
    runs-on: ubuntu-24.04
    env:
      DPF_COMMIT: 4238e1c7f0351bbe488d79f0899c540543ac7583
    steps:
      - uses: actions/checkout@v4
      - name: Get MinGW and DPF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix zip
          git clone https://github.com/DISTRHO/DPF dpf
          git -C dpf checkout "$DPF_COMMIT"
          git -C dpf submodule update --init --recursive
      - name: Build the Windows VST3
        working-directory: daw-plugin
        run: |
          make vst3 DPF_PATH=../dpf NOOPT=true -j4 \
            CC=x86_64-w64-mingw32-gcc-posix CXX=x86_64-w64-mingw32-g++-posix \
            AR=x86_64-w64-mingw32-ar WINDRES=x86_64-w64-mingw32-windres
          find bin -type f
          x86_64-w64-mingw32-objdump -p bin/ZaY-o-Nator.vst3/Contents/x86_64-win/ZaY-o-Nator.vst3 | grep "DLL Name"
      - name: Package
        run: |
          mkdir -p "dist/ZaY-o-Nator DAW Plugin (Windows)"
          cp -R daw-plugin/bin/ZaY-o-Nator.vst3 "daw-plugin/Install ZaY-o-Nator (Windows).bat" daw-plugin/README.md LICENSE "dist/ZaY-o-Nator DAW Plugin (Windows)/"
          (cd dist && zip -qr ZaY-o-Nator-DAW-Plugin-Windows.zip "ZaY-o-Nator DAW Plugin (Windows)")
      - uses: actions/upload-artifact@v4
        with:
          name: ZaY-o-Nator-DAW-Plugin-Windows
          path: dist/ZaY-o-Nator-DAW-Plugin-Windows.zip

  # Load the Windows VST3 on a real Windows machine: it must open with no missing DLLs, and start sending meters with Send on.
  daw-plugin-windows-test:
    needs: daw-plugin-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ZaY-o-Nator-DAW-Plugin-Windows
      - name: Load the plugin and ask for its factory
        shell: pwsh
        run: |
          Expand-Archive ZaY-o-Nator-DAW-Plugin-Windows.zip -DestinationPath w
          $dll = Resolve-Path "w/ZaY-o-Nator DAW Plugin (Windows)/ZaY-o-Nator.vst3/Contents/x86_64-win/ZaY-o-Nator.vst3"
          python -c "import ctypes,sys; d=ctypes.WinDLL(sys.argv[1]); f=d.GetPluginFactory; f.restype=ctypes.c_void_p; p=f(); print('factory', hex(p or 0)); sys.exit(0 if p else 1)" $dll

  # Publish a release on GitHub (tag like v1.0.0) and this attaches the downloads to it.
  release:
    if: github.event_name == 'release'
    needs: [plugin, daw-plugin, daw-plugin-windows-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: art
      - name: Attach the files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber art/ZaY-o-Nator-Release/*.zip art/ZaY-o-Nator-DAW-Plugins-Mac/*.zip art/ZaY-o-Nator-DAW-Plugin-Windows/*.zip
